{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "traceyard.fullname" . }}-postgres-init
  labels:
    {{- include "traceyard.labels" . | nindent 4 }}
data:
  10-traceyard.sh: |
    #!/bin/sh
    set -eu
    : "${TRACEYARD_USER:?TRACEYARD_USER is required}"
    : "${TRACEYARD_PASSWORD:?TRACEYARD_PASSWORD is required}"
    # Read the password from the environment, never from psql command arguments.
    # psql quotes values as literals; format() quotes identifiers and passwords.
    psql --no-psqlrc --set=ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    \getenv app_user TRACEYARD_USER
    \getenv app_password TRACEYARD_PASSWORD
    \getenv app_database POSTGRES_DB
    SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L', :'app_user', :'app_password') \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', :'app_database', :'app_user') \gexec
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "traceyard.fullname" . }}-postgres
  labels:
    {{- include "traceyard.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "traceyard.postgresSelector" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "traceyard.fullname" . }}-postgres
  labels:
    {{- include "traceyard.labels" . | nindent 4 }}
    {{- include "traceyard.postgresSelector" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "traceyard.fullname" . }}-postgres
  selector:
    matchLabels:
      {{- include "traceyard.postgresSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traceyard.postgresSelector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-password
            - name: TRACEYARD_USER
              value: {{ .Values.postgres.username | quote }}
            - name: TRACEYARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: app-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            timeoutSeconds: 5
            periodSeconds: 20
          startupProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: init
          configMap:
            name: {{ include "traceyard.fullname" . }}-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size | quote }}
{{- end }}
