{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "traceyard.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "traceyard.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressController.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- if or .Values.metrics.scrapeAnnotations .Values.metrics.serviceMonitor.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheus.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.prometheus.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if eq .Values.service.type "NodePort" }}
    - from:
        {{- range .Values.networkPolicy.nodePortSourceCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.tempo.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.tempo.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tempo.port }}
    - to:
        {{- range .Values.networkPolicy.ldapCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.ldapPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- if .Values.postgres.enabled }}
        - podSelector:
            matchLabels:
              {{- include "traceyard.postgresSelector" . | nindent 14 }}
        {{- else }}
        {{- range .Values.networkPolicy.externalPostgresCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "traceyard.fullname" . }}-postgres
spec:
  podSelector:
    matchLabels:
      {{- include "traceyard.postgresSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "traceyard.selector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
{{- end }}
{{- end }}
